# CI — lint + hermetic tests on every push / PR (W7 D5, step 1).
#
# What "green" here proves: the change installs from the SAME pinned lockfile CI
# and prod use, passes ruff, and passes every test that needs no external service.
# That's the CI half of CI/CD — catch regressions automatically, before merge,
# instead of "it worked on my machine". A second job builds the Docker image so a
# Dockerfile that no longer builds fails CI too (a regression guard for D2's image).
name: CI

on:
  push:
  pull_request:

# If you push twice quickly, cancel the older run — no point spending CI minutes
# on a commit that's already superseded on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Official uv action: installs uv AND caches the dependency downloads keyed
      # on uv.lock, so after the first run the ~200 MB CPU-torch install is a cache
      # hit and the job is fast. python-version pins the interpreter uv provisions.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"

      # --frozen: install EXACTLY what uv.lock pins — fail if the lockfile is stale
      # rather than silently resolving something new. This is what makes CI
      # reproducible and worth trusting.
      # --no-default-groups --group cpu: skip the GPU torch (there's no CUDA on the
      # runner) and take the CPU wheel instead. --group dev adds ruff + pytest.
      - name: Install dependencies (CPU + dev)
        run: uv sync --frozen --no-default-groups --group cpu --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      # -m "not integration": run only the hermetic tests. Anything needing a live
      # OpenSearch / real LLM key is marked `integration` and skipped here (it has
      # no cluster to talk to); those belong in a services-backed job later.
      - name: Test (pytest, hermetic only)
        run: uv run pytest -q -m "not integration"

  build:
    name: docker build
    runs-on: ubuntu-latest
    # Gate the build on green tests: no point spending minutes on a torch image
    # for a commit whose unit tests already failed. `needs` also makes the two
    # jobs show as an ordered pipeline in the Actions UI.
    needs: test
    steps:
      - uses: actions/checkout@v5

      # build-push-action needs Buildx for the `gha` cache backend below.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the D2 image. We only BUILD (push: false) — this is a regression
      # check that the Dockerfile still produces a working image, not a release.
      # cache-from/to gha stores the layer cache in GitHub Actions, so the
      # multi-minute CPU-torch `uv sync` layer is a cache hit on later runs and
      # only changed layers rebuild — the same layer-caching win the Dockerfile is
      # written for, now applied in CI.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ragops-copilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # CD — deploy to the EC2 demo box. This is the "D" in CI/CD: once main is
  # green (tests pass AND the image builds), ship it automatically.
  # ---------------------------------------------------------------------------
  deploy:
    name: deploy to EC2
    runs-on: ubuntu-latest
    # Only after BOTH gates pass — never deploy a commit that failed tests or
    # whose image didn't build.
    needs: [test, build]
    # ...and only for real pushes to main. A PR from a fork must NOT be able to
    # trigger a production deploy, and feature branches shouldn't either. Env
    # `production` is where the EC2 secrets live (and where you can add a manual
    # approval gate later).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      # No checkout needed — the box pulls its own code from git. This job just
      # opens an SSH session and runs the update remotely.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          # All connection details come from GitHub Secrets — nothing about the
          # box (host, user, key) is committed to the repo.
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true   # abort on the first failing command
          script: |
            set -e
            cd ~/ragops-copilot
            # Fetch + hard-reset (not `git pull`): CD must converge to exactly
            # what's on main, with no chance of a merge conflict from any drift
            # on the box. .env and data/ are gitignored + untracked, so they are
            # left completely untouched — the DeepSeek key and the built index
            # survive every deploy.
            git fetch --quiet origin main
            git reset --hard origin/main
            # Rebuild + restart only what changed. The CPU-torch layer is cached
            # on the box, so a code-only change rebuilds in seconds. No re-ingest:
            # the corpus is unchanged and the index persists in its volume.
            docker compose -f docker-compose.prod.yml up -d --build
            # Deploy isn't done until the service can actually answer. /health is
            # strict (503 unless OpenSearch is reachable AND the index is
            # non-empty), so this fails the job if the new build came up broken.
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T api \
                   curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
                echo "deploy healthy"; exit 0
              fi
              echo "waiting for health ($i)..."; sleep 4
            done
            echo "health check did not pass in time"; exit 1
